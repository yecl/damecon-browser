<!DOCTYPE html>
<html>

<head>
  <title>Damecon settings</title>
  <meta charset="utf-8">

  <script type="text/javascript" src="assets/js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="assets/js/popper.min.js"></script>
  <script type="text/javascript" src="assets/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="assets/js/fontawesome.js" defer></script>

  <script type="text/javascript" src="assets/js/knockout-3.5.1.js"></script>
  <script type="text/javascript" src="assets/js/knockout-i18n.js"></script>

  <script type="text/javascript" src="common.js"></script>
  <script type="text/javascript" src="config-utils.js"></script>
  <script type="text/javascript" src="settings.js"></script>

  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="webui.css" />
  <link rel="stylesheet" href="settings.css" />

  <link rel="icon" href="assets/icons/damecon_icon_48.png" />
</head>

<body>
  <div id="root" data-bind="attr: { class: `theme-${theme()} brightness-${brightness()}` }">
    <!-- ko if: settingsInitialized -->
    <div id="settings">
      <div id="settings-menu">
        <div class="menu-header">
          <!--<h5>Damecon</h5>-->
        </div>
        <div class="menu-items">
          <!-- ko foreach: configPages -->
          <div class="menu-item"
            data-bind="attr: { 'data-active': $parent.selectedConfigPage() === $data.id }, click: $parent.selectConfigPage.bind($parent)">
            <span class="icon">
              <!-- ko if: $data.img-->
              <img data-bind="attr: { src: img, alt: name }" alt="icon">
              <!-- /ko -->
              <!-- ko if: $data.faIcon -->
              <i data-bind="attr: { class: faIcon }"></i>
              <!-- /ko -->
            </span>
            <span class="header" data-bind="text: name"></span>
          </div>
          <!-- /ko -->
        </div>
        <div id="version">
          <span data-bind="text: version"></span>
        </div>
      </div>
      <div id="settings-container">
        <div class="settings-content">
          <div class="settings">
            <!-- ko template: { name: 'settings-content-' + selectedConfigPage() } -->
            <!-- /ko -->
          </div>
        </div>
        <div id="background-processes">
          <!-- ko foreach: processes -->
          <div class="process">
            <div class="process-name" data-bind="text: name"></div>
            <!-- ko if: !!$data.phase() || $data.total() > 0 -->
            <div class="process-text">
              <div class="process-phase" data-bind="text: phase"></div>
              <div class="process-progress" data-bind="text: progress"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: $data.total() > 0 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" data-bind="style: { width: progressPct() + '%'}"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: $data.total() === 0 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <!-- /ko -->
          </div>
          <!-- /ko -->
        </div>
      </div>
    </div>
    <!-- /ko -->
  </div>
  <div id="settings-content-templates">

    <script type="text/html" id="settings-content-0">
      <h3>Damecon Settings</h3>
      
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${appTab() === appTabs.window ? ' active' : ''}` }, click: () => appTab(appTabs.window)">Window</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${appTab() === appTabs.kancolle ? ' active' : ''}` }, click: () => appTab(appTabs.kancolle)">KanColle</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${appTab() === appTabs.application ? ' active' : ''}` }, click: () => appTab(appTabs.application)">Application</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-bind="attr: { class: `nav-link${appTab() === appTabs.advanced ? ' active' : ''}` }, click: () => appTab(appTabs.advanced)">Advanced</a>
        </li>
      </ul>
      <div class="form-group"></div>
      <!-- ko if: appTab() === appTabs.window -->
      <h5>Style</h5>
      <div class="settings-group">
        <div class="form-row">
          <label for="windowstyletheme" class="col-sm-3">Theme</label>
          <select id="windowstyletheme" class="col form-control" data-bind="options: configSchema.window.style.theme.options, value: config.window.style.theme"></select>
        </div>
        <div class="form-row">
          <label for="windowstylebright" class="col-sm-3">Brightness</label>
          <select id="windowstylebright" class="col form-control" data-bind="options: configSchema.window.style.brightness.options, value: config.window.style.brightness"></select>
        </div>
      </div>
      <h5>View</h5>
      <div class="settings-group">
        <div class="form-group">
          <label>Hide address bar for sites (Alt+A to override)</label>
          <div class="form-items-scroller">
            <!-- ko foreach: config.window.view.hideAddressBarSites -->
            <div class="form-array-string-item input-group">
              <input type="text" class="form-control" data-bind="value: $rawData" placeholder="e.g. https://tsunkit.net/*">
              <div class="input-group-append">
                <button type="button" class="btn btn-secondary" data-bind="click: () => $parent.removeHideAddressBarSite($data)" title="remove this entry"><i class="fa-sharp fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <!-- /ko -->
          </div>
          <div class="form-array-string-item add-new form-row">
            <div class="input-group col col-sm-2">
              <label for="new-hide-adressbar-site-input">Add site:</label>
            </div>
            <div class="input-group col">
              <input id="new-hide-adressbar-site-input" type="text" class="form-control" data-bind="value: newHideAddressBarSite, valueUpdate: 'afterkeydown'" placeholder="e.g. https://tsunkit.net/*">
              <div class="input-group-append">
                <button type="button" class="btn btn-secondary" data-bind="click: addNewHideAddressBarSite, enable: canAddNewHideAddressBarSite" title="add a site to hide addressbar for"><i class="fa-sharp fa-solid fa-plus"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div class="form-row-gap">
          <div>
            <label>Show in tab bar when hidden:</label>
          </div>
          <div>
            <input type="checkbox" id="always-show-extensions" data-bind="checked: config.window.view.alwaysShowExtensions">
            <label for="always-show-extensions" title="extensions"><i class="fa-solid fa-puzzle-piece"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-goback" data-bind="checked: config.window.view.alwaysShowBack">
            <label for="always-show-goback" title="go back"><i class="fa-solid fa-arrow-left"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-goforward" data-bind="checked: config.window.view.alwaysShowForward">
            <label for="always-show-goforward" title="go forward"><i class="fa-solid fa-arrow-right"></i></label>
          </div>
          <div>
            <input type="checkbox" id="always-show-reload" data-bind="checked: config.window.view.alwaysShowReload">
            <label for="always-show-reload" title="refresh"><i class="fa-solid fa-rotate-right"></i></label>
          </div>
        </div>
      </div>
      <!-- /ko -->
      <!-- ko if: appTab() === appTabs.kancolle -->
      <div class="settings-group">
        <div class="form-group form-check">
          <input class="form-check-input" id="kancolleforcecookiehack" type="checkbox" data-bind="checked: config.kancolle.forceCookieHack">
          <label class="form-check-label" for="kancolleforcecookiehack">Force DMM region cookie hack (experimental)</label>
        </div>
      </div>
      <!-- /ko -->
      <!-- ko if: appTab() === appTabs.application -->
      <div class="settings-group">
        <div class="form-group form-check">
          <input class="form-check-input" id="appupdatesremoveold" type="checkbox" data-bind="checked: config.app.update.removeOld">
          <label class="form-check-label" for="appupdatesremoveold">Clear old app files on update</label>
        </div>
        <div class="form-row">
          <label for="appdatalocation" class="col-sm-3">User data location</label>
          <select id="appdatalocation" class="col form-control" data-bind="options: configSchema.app.data.location.options, value: config.app.data.location"></select>
        </div>
        <!-- ko if: config.app.data.location() != 'custom' -->
        <div class="form-group">
          <div class="form-group"></div>
          <span>Path:</span>
          <span class="sensitive">
            <!-- ko if: config.app.data.location() == 'home' -->
            <span class="selectable" data-bind="text: paths.home"></span>
            <!-- /ko -->
            <!-- ko if: config.app.data.location() == 'appdata' -->
            <span class="selectable" data-bind="text: paths.appData"></span>
            <!-- /ko -->
            <!-- ko if: config.app.data.location() == 'appdir' -->
            <span class="selectable" data-bind="text: paths.app"></span>
            <!-- /ko -->
          </span>
        </div>
        <!-- /ko -->
        <!-- ko if: config.app.data.location() == 'custom' -->
        <div class="form-row">
          <label for="appdatacustompath" class="col-sm-4">Custom location</label>
          <div class="input-group col">
            <input type="text" id="appdatacustompath" class="form-control sensitive" data-bind="value: config.app.data.customPath"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomDataPath">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
        <div class="form-group"></div>
        <div class="form-group">
          <span>Note: You will need to close and restart Damecon for the data location setting to take effect.</span>
        </div>
      </div>
      <div class="form-group">
        <button type="button" class="btn btn-secondary" data-bind="click: clearSessionCache">Clear browser cache</button>
      </div>
      <!-- /ko -->
      <!-- ko if: appTab() === appTabs.advanced -->
      <p>Damecon must be restarted for these settings to take effect.</p>
      <h5>Behavior</h5>
      <div class="settings-group">
        <div class="form-group form-check">
          <input class="form-check-input" id="confirmclose" type="checkbox" data-bind="checked: config.window.behavior.confirmCloseGamePage">
          <label class="form-check-label" for="confirmclose">Confirm before closing game page tabs</label>
        </div>
        <div class="form-group form-check">
          <input class="form-check-input" id="backgroundocclusion" type="checkbox" data-bind="checked: config.window.behavior.occlusion">
          <label class="form-check-label" for="backgroundocclusion">Throttle activity when running in background</label>
        </div>
      </div>
      <h5>Graphics</h5>
      <div class="settings-group">
        <div class="form-group form-check">
          <label class="form-check-label" class="col-sm-8" for="availablegpumemory">Available GPU memory (MB)</label>
          <input id="availablegpumemory" type="number" class="col form-control" data-bind="value: config.window.gpu.availableMemoryMb" placeholder="10000" min="256" max="64000">
        </div>
        <div class="form-group form-check">
          <input class="form-check-input" id="rasterization" type="checkbox" data-bind="checked: config.window.gpu.rasterization">
          <label class="form-check-label" for="rasterization">Force GPU rasterization</label>
        </div>
        <div class="form-group form-check">
          <input class="form-check-input" id="nativebuffers" type="checkbox" data-bind="checked: config.window.gpu.nativeBuffers">
          <label class="form-check-label" for="nativebuffers">Enable native GPU memory buffers</label>
        </div>
        <div class="form-group form-check">
          <input class="form-check-input" id="compositorresources" type="checkbox" data-bind="checked: config.window.gpu.compositorResources">
          <label class="form-check-label" for="compositorresources">Enable GPU memory buffer compositor resources</label>
        </div>
      </div>
      <!-- /ko -->
    </script>

    <script type="text/html" id="settings-content-1">
      <h3>KC3Kai Settings</h3>
      <div class="settings-group">
        <div class="form-row">
          <label for="kc3gamepage" class="col-sm-3">Game startup page</label>
          <select id="kc3gamepage" class="col form-control" data-bind="options: configSchema.kc3kai.startup.gamePage.options, value: config.kc3kai.startup.gamePage"></select>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3opendevtools" type="checkbox" data-bind="checked: config.kc3kai.startup.openDevtools">
          <label class="form-check-label" for="kc3opendevtools">Auto-open devtools</label>
        </div>
        <!-- ko if: config.kc3kai.startup.openDevtools() -->
        <div class="form-row">
          <label for="kc3opendevtoolsdelay" class="col-sm-6">Devtools open delay (seconds):</label>
          <input id="kc3opendevtoolsdelay" type="number" class="col form-control" data-bind="value: config.kc3kai.startup.openDevtoolsDelay" min="0" step="0.5" max="10">
        </div>
        <!-- /ko -->
        <div class="form-check">
          <input class="form-check-input" id="kc3openstratroom" type="checkbox" data-bind="checked: config.kc3kai.startup.openStratRoom">
          <label class="form-check-label" for="kc3openstratroom">Auto-open strategy room</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3devtoolsrecordnetworklog" type="checkbox" data-bind="checked: config.kc3kai.startup.devtoolsRecordNetworkLog">
          <label class="form-check-label" for="kc3devtoolsrecordnetworklog">Record network log in DevTools (uses more memory; KC3 works either way)</label>
        </div>
      </div>
      <div class="settings-group">
        <div class="form-row">
          <label for="kc3updatechannel" class="col-sm-3">Update channel</label>
          <select id="kc3updatechannel" class="col form-control" data-bind="options: configSchema.kc3kai.update.channel.options, value: config.kc3kai.update.channel, enable: canSetKc3Channel"></select>
        </div>
        <!-- ko if: !config.kc3kai.update.channel()?.startsWith('custom') -->
        <div class="form-row">
          <label for="kc3updateschedule" class="col-sm-3">Update schedule</label>
          <select id="kc3updateschedule" class="col form-control" data-bind="options: configSchema.kc3kai.update.schedule.options, value: config.kc3kai.update.schedule"></select>
        </div>
        <div class="form-check">
          <input class="form-check-input" id="kc3updatesauto" type="checkbox" data-bind="checked: config.kc3kai.update.auto">
          <label class="form-check-label" for="kc3updatesauto">Download/apply updates automatically</label>
        </div>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel() === 'custom1' -->
        <div class="form-row">
          <label for="kc3custom1location" class="col-sm-3">Location</label>
          <div class="input-group col">
            <input type="text" id="kc3custom1location" class="form-control sensitive" data-bind="value: config.kc3kai.custom1Location"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomKc3Path">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel() === 'custom2' -->
        <div class="form-row">
          <label for="kc3custom2location" class="col-sm-3">Location</label>
          <div class="input-group col">
            <input type="text" id="kc3custom2location" class="form-control sensitive" data-bind="value: config.kc3kai.custom2Location"/>
            <div class="input-group-append">
              <button type="button" class="btn btn-secondary" data-bind="click: getCustomKc3Path">Browse</button>
            </div>
          </div>
        </div>
        <!-- /ko -->
      </div>
      <div class="form-group">
        <!-- ko if: !config.kc3kai.update.channel()?.startsWith('custom') -->
        <button class="btn btn-secondary" type="button" data-bind="click: kc3CheckForUpdates, enable: canUpdateKc3">Check for updates & reload</button>
        <!-- /ko -->
        <!-- ko if: config.kc3kai.update.channel()?.startsWith('custom') -->
        <button class="btn btn-secondary" type="button" data-bind="click: kc3CheckForUpdates, enable: canUpdateKc3">Reload</button>
        <!-- /ko -->
        <div class="text-danger small mt-1" data-bind="visible: kc3UpdateError, text: kc3UpdateError"></div>
      </div>
      <p>Note: reloading will automatically close any currently-open KC3 tabs.</p>
    </script>

    <script type="text/html" id="settings-content-2">
      <h3>Proxy</h3>
      <p class="text-muted">How Damecon reaches the internet. KCCP can sit in front of the proxy for game servers.</p>

      <div class="settings-group route-map">
        <div class="route">
          <div class="route-source"><i class="fa-solid fa-globe"></i> Websites, logins, updates</div>
          <div class="route-hops">
            <span class="hop-arrow"></span>
            <span data-bind="attr: { class: `hop ${config.proxy.enable() ? 'on' : 'off'}` }">
              <i class="fa-solid fa-circle-nodes"></i> <span data-bind="text: proxyLabel()"></span>
            </span>
            <span class="hop-arrow"></span>
            <span class="hop end"><i class="fa-solid fa-earth-asia"></i> Internet</span>
          </div>
        </div>
        <div class="route">
          <div class="route-source"><i class="fa-solid fa-anchor"></i> Game servers</div>
          <div class="route-hops">
            <span class="hop-arrow"></span>
            <!-- ko if: config.proxy.kccp.enable() -->
            <a href="#" class="hop on kccp" data-bind="click: () => selectedConfigPage(4)" title="KCCP settings">
              <img src="assets/icons/kccp.png" alt=""> <span data-bind="text: kccpLabel()"></span>
            </a>
            <span class="hop-arrow"></span>
            <span data-bind="attr: { class: `hop ${kccpUpstreamOn() ? 'on' : 'off'}` }">
              <i class="fa-solid fa-circle-nodes"></i> <span data-bind="text: kccpUpstreamLabel()"></span>
            </span>
            <!-- /ko -->
            <!-- ko ifnot: config.proxy.kccp.enable() -->
            <span data-bind="attr: { class: `hop ${config.proxy.enable() ? 'on' : 'off'}` }">
              <i class="fa-solid fa-circle-nodes"></i> <span data-bind="text: proxyLabel()"></span>
            </span>
            <!-- /ko -->
            <span class="hop-arrow"></span>
            <span class="hop end"><i class="fa-solid fa-server"></i> kancolle-server.com</span>
          </div>
        </div>
      </div>

      <h5>Proxy server</h5>
      <div class="settings-group">
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: config.proxy.enable">
          <span class="slider"></span>
          <span>Use a proxy</span>
        </label>
        <p class="small text-muted">For networks that need a proxy to reach anything. KC3 updates, the web store and the built-in KCCP use it too.</p>
        <div data-bind="css: { 'dm-disabled': !config.proxy.enable() }">
          <div class="btn-group btn-group-sm mb-3" role="group">
            <button type="button" data-bind="attr: { class: `btn ${config.proxy.mode() === 'http-proxy' ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => config.proxy.mode('http-proxy')">HTTP</button>
            <button type="button" data-bind="attr: { class: `btn ${config.proxy.mode() === 'socks5-proxy' ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => config.proxy.mode('socks5-proxy')">SOCKS5</button>
          </div>
          <div class="dm-address">
            <input type="text" class="form-control" aria-label="Proxy host" data-bind="value: config.proxy.client.host" placeholder="127.0.0.1">
            <span>:</span>
            <input type="number" class="form-control port" aria-label="Proxy port" data-bind="value: config.proxy.client.port" placeholder="7890">
            <button type="button" class="btn btn-primary" data-bind="click: saveProxyConfig">Save</button>
          </div>
          <div class="text-success small mt-1" data-bind="visible: proxySaved">Saved and applied</div>
        </div>
      </div>

      <h5>KCCacheProxy</h5>
      <div class="settings-group">
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: config.proxy.kccp.enable">
          <span class="slider"></span>
          <span>Send game servers through KCCP</span>
        </label>
        <p class="small text-muted">
          KCCP caches game assets (ship art, voices, maps...) on disk and can apply asset mods.
          Only <code>*.kancolle-server.com</code> goes through it.
        </p>
        <button type="button" class="btn btn-secondary btn-sm" data-bind="click: () => selectedConfigPage(4)">KCCP settings <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </script>

    <script type="text/html" id="settings-content-4">
      <h3>KCCacheProxy</h3>
      <p class="text-muted">Keeps game assets on disk so they load instantly, and applies asset mods.</p>

      <!-- ko ifnot: config.proxy.kccp.enable() -->
      <div class="settings-group dm-notice">
        <i class="fa-solid fa-circle-pause"></i>
        <span>KCCP is off. Game servers go straight through the proxy.</span>
        <button type="button" class="btn btn-primary btn-sm" data-bind="click: () => config.proxy.kccp.enable(true)">Turn on</button>
      </div>
      <!-- /ko -->

      <h5>Connection</h5>
      <div class="settings-group">
        <div class="btn-group btn-group-sm mb-2" role="group">
          <button type="button" data-bind="attr: { class: `btn ${config.proxy.kccp.mode() === 'internal' ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => config.proxy.kccp.mode('internal')">Built-in</button>
          <button type="button" data-bind="attr: { class: `btn ${config.proxy.kccp.mode() === 'external' ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => config.proxy.kccp.mode('external')">External</button>
        </div>
        <p class="small text-muted" data-bind="visible: config.proxy.kccp.mode() === 'internal'">
          Damecon runs KCCP itself. Its downloads from the game servers go through the proxy on the Proxy page, and no
          certificate needs to be trusted. Cache, mods and KCCP's config.json live in <code>userdata/kccp</code>.
        </p>
        <p class="small text-muted" data-bind="visible: config.proxy.kccp.mode() === 'external'">
          Use a KCCP you run yourself and enter its HTTPS (MITM) port. It downloads from the game servers on its own
          network, not through Damecon's proxy. To proxy it, run it on a recent Node.js (e.g. the Docker image) with
          <code>NODE_USE_ENV_PROXY=1</code> and <code>HTTPS_PROXY=http://host:port</code>, or use a system-wide/TUN proxy.
        </p>
        <label class="small text-muted mb-1" data-bind="text: config.proxy.kccp.mode() === 'internal' ? 'Listen on' : 'KCCP address'"></label>
        <div class="dm-address">
          <input type="text" class="form-control" aria-label="KCCP host" data-bind="value: config.proxy.kccp.host" placeholder="127.0.0.1">
          <span>:</span>
          <input type="number" class="form-control port" aria-label="KCCP HTTPS port" data-bind="value: config.proxy.kccp.port" placeholder="8082">
          <button type="button" class="btn btn-primary" data-bind="click: saveProxyConfig">Save</button>
        </div>
        <div class="text-success small mt-1" data-bind="visible: proxySaved">Saved and applied</div>
      </div>

      <!-- ko if: config.proxy.kccp.enable() && config.proxy.kccp.mode() === 'external' -->
      <div class="settings-group dm-notice">
        <i class="fa-solid fa-circle-info"></i>
        <span>Stats, cache tools and mods are for the built-in KCCP. Manage an external KCCP in its own app.</span>
      </div>
      <!-- /ko -->

      <!-- ko if: isBuiltinKccp() && kccp() && kccp().loaded -->
      <div class="settings-group dm-status">
        <div class="dm-status-line">
          <span data-bind="attr: { class: `dm-dot ${kccp().running ? 'on' : 'off'}` }"></span>
          <strong data-bind="text: kccp().running ? 'Running' : 'Not running'"></strong>
          <span class="text-muted" data-bind="text: kccp().running ? `${config.proxy.kccp.host()}:${config.proxy.kccp.port()}` : kccp().error"></span>
          <!-- ko if: kccp().busy -->
          <span class="dm-busy"><i class="fa-solid fa-spinner fa-spin"></i> <span data-bind="text: kccp().busy"></span>...</span>
          <!-- /ko -->
        </div>
        <div class="dm-stats">
          <div class="dm-stat"><span class="value" data-bind="text: kccp().cachedFiles"></span><span class="label">files cached</span></div>
          <div class="dm-stat"><span class="value" data-bind="text: kccp().stats.totalHandled || 0"></span><span class="label">requests</span></div>
          <div class="dm-stat"><span class="value" data-bind="text: kccp().stats.inCache || 0"></span><span class="label">from cache</span></div>
          <div class="dm-stat"><span class="value" data-bind="text: kccp().stats.fetched || 0"></span><span class="label">downloaded</span></div>
          <div class="dm-stat"><span class="value" data-bind="text: kccp().stats.failed || 0"></span><span class="label">failed</span></div>
          <div class="dm-stat"><span class="value" data-bind="text: `${((kccp().stats.bandwidthSaved || 0) / 1048576).toFixed(1)} MB`"></span><span class="label">saved</span></div>
        </div>
        <div class="dm-error" data-bind="visible: kccpError">
          <i class="fa-solid fa-triangle-exclamation"></i> <span data-bind="text: kccpError"></span>
        </div>
      </div>

      <div class="btn-group btn-group-sm mb-2" role="group">
        <button type="button" data-bind="attr: { class: `btn ${kccpTab() == kccpTabs.status ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => kccpTab(kccpTabs.status)"><i class="fa-solid fa-box-archive"></i> Cache</button>
        <button type="button" data-bind="attr: { class: `btn ${kccpTab() == kccpTabs.mods ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => kccpTab(kccpTabs.mods)"><i class="fa-solid fa-palette"></i> Mods <span data-bind="visible: kccp().mods.length, text: `(${kccp().mods.length})`"></span></button>
        <button type="button" data-bind="attr: { class: `btn ${kccpTab() == kccpTabs.log ? 'btn-primary' : 'btn-outline-primary'}` }, click: () => kccpTab(kccpTabs.log)"><i class="fa-solid fa-terminal"></i> Log</button>
      </div>

      <!-- ko if: kccpTab() == kccpTabs.status -->
      <div class="settings-group">
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: kccp().options.disableBrowserCache, event: { change: (d, e) => kccpSetOption('disableBrowserCache', e) }">
          <span class="slider"></span>
          <span>Always ask KCCP for game assets</span>
        </label>
        <p class="small text-muted">Turns off the browser's own cache for game assets so every load is served (and counted) by KCCP.</p>
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: kccp().options.bypassGadgetUpdateCheck, event: { change: (d, e) => kccpSetOption('bypassGadgetUpdateCheck', e) }">
          <span class="slider"></span>
          <span>Bypass gadget update check</span>
        </label>
        <p class="small text-muted">Serves cached gadget files without asking the server whether they changed.</p>
      </div>
      <h5>Fill the cache</h5>
      <div class="settings-group">
        <div class="dm-tools">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('preload')" title="download the assets KCCP recommends ahead of time"><i class="fa-solid fa-cloud-arrow-down"></i> Preload assets</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('import-cache')"><i class="fa-solid fa-file-zipper"></i> Import cache dump</button>
        </div>
        <p class="small text-muted mb-0">
          KCCP only caches what you load. Preload fetches the common assets now; a
          <a href="https://github.com/Tibowl/KCCacheProxy/wiki/Installation-and-setup#using-cache-dumps" target="_blank">cache dump</a>
          adds everything at once.
        </p>
      </div>
      <h5>Maintenance</h5>
      <div class="settings-group">
        <div class="dm-tools">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => kccpCall('open-cache-folder')"><i class="fa-regular fa-folder-open"></i> Cache folder</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => kccpCall('open-data-folder')"><i class="fa-regular fa-folder"></i> Data folder</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => kccpCall('reload-cache')"><i class="fa-solid fa-rotate"></i> Reload cache</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('verify-cache', { deleteInvalid: true })" title="compare cached files with the game server and delete outdated ones"><i class="fa-solid fa-list-check"></i> Verify cache</button>
        </div>
      </div>
      <!-- /ko -->

      <!-- ko if: kccpTab() == kccpTabs.mods -->
      <div class="settings-group">
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: kccp().options.enableModder, event: { change: (d, e) => kccpSetOption('enableModder', e) }">
          <span class="slider"></span>
          <span>Enable asset mods</span>
        </label>
        <p class="small text-muted">Mods replace game images and sounds as they pass through KCCP.</p>
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: kccp().options.autoUpdateGitMods, event: { change: (d, e) => kccpSetOption('autoUpdateGitMods', e) }">
          <span class="slider"></span>
          <span>Update git mods when KCCP starts</span>
        </label>
      </div>
      <h5>.hack files</h5>
      <div class="settings-group">
        <label class="dm-switch">
          <input type="checkbox" data-bind="checked: kccp().options.enableHacks, event: { change: (d, e) => kccpSetOption('enableHacks', e) }">
          <span class="slider"></span>
          <span>Use .hack files</span>
        </label>
        <p class="small text-muted">
          Classic whole-file replacement, as used by poi and other tools. Put <code>&lt;name&gt;.hack.&lt;ext&gt;</code> in the
          hack folder under the game path, e.g. <code>kcs2/resources/ship/full/0467_6223_qgrxbhuvtrbf.hack.png</code>.
          They take priority over the cache and the mods below.
          Ship position and name tweaks go in <code>kcs/resources/swf/ships/&lt;ship file name&gt;.config.ini</code>
          (岛风GO format); they apply when the game starts. Reload after adding or removing files.
        </p>
        <div class="dm-tools mb-0">
          <span class="small align-self-center mr-2" data-bind="text: `${kccp().hackFiles} .hack files, ${kccp().shipInis} config.ini`"></span>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => kccpCall('open-hack-folder')"><i class="fa-regular fa-folder-open"></i> Hack folder</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => kccpCall('reload-hacks')" title="rescan the folder and clear the browser cache"><i class="fa-solid fa-rotate"></i> Reload</button>
        </div>
      </div>
      <h5>Installed <small class="text-muted">later mods override earlier ones</small></h5>
      <div class="settings-group">
        <!-- ko foreach: kccp().mods -->
        <div class="kccp-mod">
          <div class="kccp-mod-label">
            <div>
              <span data-bind="text: `${$index() + 1}.`"></span>
              <strong data-bind="text: info ? info.name : path"></strong>
              <!-- ko if: info && info.version -->
              <span class="subtext" data-bind="text: `v${info.version}`"></span>
              <!-- /ko -->
              <!-- ko if: git -->
              <span class="subtext badge badge-secondary">git</span>
              <!-- /ko -->
              <!-- ko if: !info -->
              <span class="subtext badge badge-danger">missing</span>
              <!-- /ko -->
            </div>
            <!-- ko if: info && info.authors -->
            <span class="subtext" data-bind="text: info.authors.join(', ')"></span>
            <!-- /ko -->
          </div>
          <div class="controls">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="visible: $index() > 0, click: () => $root.kccpCall('move-mod', { index, offset: -1 })" title="move up"><i class="fa-solid fa-arrow-up"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="visible: $index() < $root.kccp().mods.length - 1, click: () => $root.kccpCall('move-mod', { index, offset: 1 })" title="move down"><i class="fa-solid fa-arrow-down"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="visible: git, click: () => $root.kccpCall('update-git-mod', { index })" title="update from git"><i class="fa-solid fa-rotate"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: () => $root.kccpCall('open-mod-folder', { index })" title="open folder"><i class="fa-regular fa-folder-open"></i></button>
            <button type="button" class="btn btn-outline-danger btn-sm" data-bind="click: () => $root.kccpCall('remove-mod', { index })" title="remove from list (files are kept)"><i class="fa-regular fa-trash-can"></i></button>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: kccp().mods.length === 0 -->
        <p class="small text-muted">No mods yet. Install one below or add it from git.</p>
        <!-- /ko -->
        <div class="dm-address mt-3">
          <input type="text" class="form-control" aria-label="Git mod URL" data-bind="textInput: kccpGitUrl" placeholder="https://github.com/user/some-kccp-mod">
          <button type="button" class="btn btn-primary" data-bind="enable: !kccp().busy && kccpGitUrl(), click: () => kccpAddGitMod()">Add from git</button>
        </div>
        <div class="dm-tools mt-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('add-mod')"><i class="fa-regular fa-file"></i> Add .mod.json</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('convert-poi')" title="convert a poi mod folder; the original files must be in the cache"><i class="fa-solid fa-right-left"></i> Convert poi mod</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('update-git-mods')"><i class="fa-solid fa-code-pull-request"></i> Update git mods</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('reload-mods')"><i class="fa-solid fa-rotate"></i> Reload</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="enable: !kccp().busy, click: () => kccpCall('prepatch')" title="apply mods to every cached image now instead of on first load"><i class="fa-solid fa-wand-magic-sparkles"></i> Pre-patch cache</button>
        </div>
      </div>
      <h5>Get mods</h5>
      <div class="settings-group">
        <!-- ko foreach: kccpRecommendedMods -->
        <div class="dm-row">
          <div>
            <a data-bind="attr: { href: url }, text: name" target="_blank"></a>
            <span class="subtext" data-bind="text: `by ${authors.join(', ')}`"></span>
          </div>
          <button type="button" class="btn btn-outline-primary btn-sm" data-bind="enable: !$root.kccp().busy, click: () => $root.kccpAddGitMod(url)"><i class="fa-solid fa-plus"></i> Install</button>
        </div>
        <!-- /ko -->
      </div>
      <!-- /ko -->

      <!-- ko if: kccpTab() == kccpTabs.log -->
      <div id="kccp-log-scroller" class="dm-log">
        <!-- ko foreach: kccpLog -->
        <div data-bind="attr: { class: `dm-log-line ${$data[2]}` }">
          <span class="time" data-bind="text: $data[0]"></span><span class="msg" data-bind="text: $data[3]"></span>
        </div>
        <!-- /ko -->
        <!-- ko if: kccpLog().length === 0 -->
        <div class="dm-log-line"><span class="time">--</span> Nothing logged yet.</div>
        <!-- /ko -->
      </div>
      <!-- /ko -->
      <!-- /ko -->
    </script>

    <script type="text/html" id="settings-content-3">
      <h3>Downloads
        <button type="button" class="btn btn-secondary btn-sm" data-bind="click: () => chrome.downloads.showDefaultFolder()" title="open downloads folder"><i class="fa-solid fa-folder"></i></button>
        <button type="button" class="btn btn-secondary btn-sm" data-bind="click: () => clearFinishedDownloads()" title="clear finished downloads"><i class="fa-regular fa-trash-can"></i></button>
      </h3>
      <div class="settings-group form-items-scroller">
        <!-- ko foreach: downloads -->
        <div class="download-item" data-bind="click: open">
          <div class="download-info">
            <span class="download-label">
              <label class="filename" data-bind="text: file"></label>
              <span class="bytes-received">
                <!-- ko if: state() == 'in_progress' && totalBytes() > 0 -->
                <label data-bind="text: `${received()}/${total()}`"></label>
                <!-- /ko -->
                <!-- ko if: state() == 'in_progress' && !totalBytes -->
                <label data-bind="text: received"></label>
                <!-- /ko -->
                <!-- ko if: ['complete','interrupted'].includes(state()) -->
                <label data-bind="text: total"></label>
                <label data-bind="text: `(${state()})`"></label>
                <!-- /ko -->
                <!-- ko if: paused() -->
                <label data-bind="text: ' (paused)'"></label> 
                <!-- /ko -->
              </span>
            </span>
            <div class="controls">
              <!-- ko if: state() === 'in_progress' && !paused() -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: pause, clickBubble: false" title="pause"><i class="fa-solid fa-pause"></i></button>
              <!-- /ko --> 
              <!-- ko if: canResume() -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: resume, clickBubble: false" title="resume"><i class="fa-solid fa-play"></i></button>
              <!-- /ko -->
              <!-- ko if: state() === 'complete' -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: openFolder, clickBubble: false" title="show in folder"><i class="fa-solid fa-folder-open"></i></button>
              <button type="button" class="btn btn-outline-danger btn-sm" data-bind="click: deleteFile, clickBubble: false" title="delete file"><i class="fa-regular fa-trash-can"></i></button>
              <!-- /ko -->
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bind="click: erase, clickBubble: false" title="remove entry"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
          <div class="download-progress">
            <!-- ko if: typeof progressPct() !== 'undefined' && progressPct() < 1 -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" data-bind="style: { width: progressPct()*100 + '%'}"></div>
            </div>
            <!-- /ko -->
            <!-- ko if: typeof progressPct() === 'undefined' -->
            <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" title="progress bar" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <!-- /ko -->
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: !downloads().length -->
        <div class="form-group">
          <div>
            <label>When you download files, they'll show up here.</label>
          </div>
        </div>
        <!-- /ko -->
      </div>
    </script>

  </div>
</body>

</html>
