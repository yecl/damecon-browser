<!DOCTYPE html>
<html>

<head>
  <title>Find in page</title>
  <meta charset="utf-8">

  <script type="text/javascript" src="assets/js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="assets/js/popper.min.js"></script>
  <script type="text/javascript" src="assets/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="assets/js/fontawesome.js"></script>

  <script type="text/javascript" src="assets/js/knockout-3.5.1.js"></script>
  <script type="text/javascript" src="i18n.js"></script>

  <script type="text/javascript" src="common.js"></script>
  <script type="text/javascript" src="config-utils.js"></script>
  <script type="text/javascript" src="search.js"></script>

  <link rel="stylesheet" href="webui.css" />
  <link rel="stylesheet" href="settings.css" />

  <link rel="icon" href="assets/icons/damecon_icon_48.png" />
</head>
<body>
  <!-- ko if: config -->
  <div id="root" data-bind="event: { keydown: rootKeyDown }">
    <div class="toolbar search-bar">
      <label for="search-input" class="find-icon" title="find in page"><i class="lucide lucide-search"></i></label>
      <div class="find-bar input-bar">
        <input id="search-input" type="text" placeholder="Find in page" data-bind="value: searchInput, valueUpdate: 'afterkeydown', event: { keydown: onKeyDown }"/>
      </div>
      <!-- ko if: searchResult() && searchInput().length > 0 -->
      <span class="find-results" data-bind="text: `${searchResult().activeMatchOrdinal}/${searchResult().matches}`"></span>
      <!-- /ko -->
      <span class="find-divider"></span>
      <button type="button" class="control" data-bind="click: () => startSearch(false), clickBubble: false" title="previous match (Shift+Enter)"><i class="lucide lucide-chevron-up"></i></button>
      <button type="button" class="control" data-bind="click: () => startSearch(true), clickBubble: false" title="next match (Enter)"><i class="lucide lucide-chevron-down"></i></button>
      <button type="button" class="control" data-bind="click: closeSearch, clickBubble: false" title="close search (Esc)"><i class="lucide lucide-x"></i></button>
    </div>
  </div>
  <!-- /ko -->
</body>
</html>
