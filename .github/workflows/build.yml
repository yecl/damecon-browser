name: Build All Platforms

# Run by hand (Actions → Build All Platforms → Run workflow, or gh workflow run), not on every push
on:
  workflow_dispatch:

# A new run on a branch cancels that branch's previous run, queued or stuck
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # both architectures on one runner: macOS runners are scarce, and one queues once
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      # each upload follows its own make, in case a make clears the previous output
      - name: Make arm64 distributables
        working-directory: packages/shell
        run: npx electron-forge make --arch=arm64

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: damecon-macos-arm64
          path: packages/shell/out/make/**/*-arm64.dmg

      - name: Make x64 distributables
        working-directory: packages/shell
        run: npx electron-forge make --arch=x64

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: damecon-macos-x64
          path: packages/shell/out/make/**/*-x64.dmg

  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Make Windows distributables
        working-directory: packages/shell
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: damecon-windows-${{ matrix.arch }}
          path: packages/shell/out/make/**/*.zip

  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot rpm

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Make Linux distributables
        working-directory: packages/shell
        run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: damecon-linux-${{ matrix.arch }}
          path: |
            packages/shell/out/make/**/*.deb
            packages/shell/out/make/**/*.rpm
            packages/shell/out/make/**/*.zip
